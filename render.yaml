services:
  - type: web
    name: jastipkampung
    runtime: docker
    plan: free
    region: singapore
    branch: master
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: JastipKampung
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: jastipkampung-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: jastipkampung-db
    plan: free
    region: singapore
    databaseName: jastipkampung
    user: jastipkampung
